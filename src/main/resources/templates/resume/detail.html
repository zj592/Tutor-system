<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家教简历详情</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <div class="card">
        <div class="card-header bg-info text-white">
            <h3>家教简历详情</h3>
        </div>
        <div class="card-body">
            <p><strong>擅长科目：</strong>
                <span th:each="subject : ${resume.getSubjectArray()}" th:text="${subject}" class="badge bg-info me-2"></span>
            </p>
            <p><strong>家教经验：</strong><p th:text="${resume.experience}"></p></p>
            <p><strong>期望薪资：</strong><span th:text="${resume.expectedSalary} + '元/小时'"></span></p>
        </div>
        <div class="card-footer text-muted">
            <p>发布时间：<span th:text="${#temporals.format(resume.publishTime, 'yyyy-MM-dd HH:mm')}"></span></p>
        </div>
    </div>
    <div class="mt-3">
        <a href="/" class="btn btn-outline-info">返回首页</a>
        <a href="/resumes" class="btn btn-info">查看更多简历</a>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
