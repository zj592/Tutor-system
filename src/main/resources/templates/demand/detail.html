<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家教需求详情</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <div class="card">
        <div class="card-header bg-primary text-white">
            <h3>家教需求详情</h3>
        </div>
        <div class="card-body">
            <p><strong>辅导科目：</strong><span th:text="${demand.subject}"></span></p>
            <p><strong>辅导年级：</strong><span th:text="${demand.grade}"></span></p>
            <p><strong>薪资待遇：</strong><span th:text="${demand.salary} + '元/小时'"></span></p>
            <p><strong>需求描述：</strong><p th:text="${demand.description}"></p></p>
        </div>
        <div class="card-footer text-muted">
            <p>发布时间：<span th:text="${#temporals.format(demand.publishTime, 'yyyy-MM-dd HH:mm')}"></span></p>
        </div>
    </div>
    <div class="mt-3">
        <a href="/" class="btn btn-outline-primary">返回首页</a>
        <a href="/demands" class="btn btn-primary">查看更多需求</a>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
